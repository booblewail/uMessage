[project]
name = "umessage-backend"
version = "0.1.0"
description = "uMessage backend: unified inbox and plan detection on top of Beeper Desktop"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: calls a real external service (e.g. the Gemini API); run with `pytest -m live`",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Standalone one-off script (Phase 0 spike, #2), run on its own with `uv run`.
extend-exclude = ["scripts/beeper_spike.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]
